<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex,nofollow">
<title>S48 test — mappa OSM/Leaflet + CookieWX</title>

<!-- S48: pagina usa-e-getta. Simula uno stato POST-SCAN: le regole OSM
     (classificate Funzionali via libreria globale CSI) sono gia' nella
     cache regole del loader. Sync backend spenta (hook di test B24). -->
<script>
  window.CookieWX = { config: { rulesBackendSync: false } };
  try {
    localStorage.setItem('cookiewxRegole', JSON.stringify({
      version: "2099-01-01T00:00:00.000Z",
      policyUrl: "",
      cookies: [],
      scripts: [
        { pattern: "tile.openstreetmap.org", categoria: "Funzionali", vendor: "OpenStreetMap" },
        { pattern: "nominatim.openstreetmap.org", categoria: "Funzionali", vendor: "Nominatim" }
      ],
      iframes: [
        { pattern: "openstreetmap.org", categoria: "Funzionali", vendor: "OpenStreetMap" }
      ]
    }));
  } catch (e) {}
</script>
<script src="/loader.js"></script>

<!-- Leaflet servito same-origin (essenziale, mai bloccato) -->
<link rel="stylesheet" href="/test-s47-s48-assets/leaflet.css">
<script src="/test-s47-s48-assets/leaflet.js"></script>

<script>
// ---- Sonda di rete S48: registra OGNI richiesta verso host openstreetmap ----
window.__S48 = { requests: [] };
(function () {
  function isOsm(u){ return /(^|\.)openstreetmap\.org$/i.test((function(x){ try { return new URL(x, location.href).hostname; } catch(_) { return ""; } })(u)); }
  function log(kind, url){ if (isOsm(url)) window.__S48.requests.push({ kind: kind, url: String(url).slice(0,140), t: Date.now() }); }

  var of = window.fetch;
  window.fetch = function (input, init) {
    try { log("fetch", typeof input === "string" ? input : (input && input.url) || String(input)); } catch(_){}
    return of.apply(this, arguments);
  };
  var oo = XMLHttpRequest.prototype.open;
  XMLHttpRequest.prototype.open = function (m, u) {
    try { log("xhr", u); } catch(_){}
    return oo.apply(this, arguments);
  };
  var os = navigator.sendBeacon && navigator.sendBeacon.bind(navigator);
  if (os) navigator.sendBeacon = function (u, d) { try { log("beacon", u); } catch(_){} return os(u, d); };

  new PerformanceObserver(function (list) {
    list.getEntries().forEach(function (e) { if (isOsm(e.name)) log("perf:" + (e.initiatorType || "?"), e.name); });
  }).observe({ entryTypes: ["resource"] });
})();

// ---- Mappa Leaflet reale (tile OSM caricate via <img> dinamici = test
//      MutationObserver + override Image.src) + geocoding Nominatim ----
window.__S48.mapInit = false;
window.__S48.geocode = null;
function s48StartMap() {
  if (window.__S48.mapStarted) return;
  window.__S48.mapStarted = true;
  try {
    var map = L.map("map").setView([41.8919, 12.5113], 13); // Roma
    L.tileLayer("https://tile.openstreetmap.org/{z}/{x}/{y}.png", {
      maxZoom: 19, attribution: "&copy; OpenStreetMap"
    }).addTo(map);
    window.__S48.mapStartedOk = true;
  } catch (e) { window.__S48.mapError = String(e); }
}
function s48Geocode() {
  fetch("https://nominatim.openstreetmap.org/search?format=json&q=Latina")
    .then(function (r) { return r.json(); })
    .then(function (j) { window.__S48.geocode = { ok: true, risultati: j.length }; })
    .catch(function (e) { window.__S48.geocode = { ok: false, errore: String(e) }; });
}
setTimeout(s48StartMap, 800);
setTimeout(s48Geocode, 1500);
</script>

<style>
  body { font-family: system-ui, sans-serif; max-width: 720px; margin: 40px auto; padding: 0 16px; color: #111; }
  #map { height: 320px; border: 1px solid #ccc; border-radius: 10px; margin: 16px 0; }
</style>
</head>
<body>
<h1>S48 — mappa OpenStreetMap (Leaflet) sotto CookieWX</h1>
<p>Regole simulate: OSM tile + Nominatim = <b>Funzionali</b>. Atteso: mappa
ferma pre-consenso; carica dopo consenso Funzionali; ferma dopo Rifiuta.</p>
<div id="map"></div>
</body>
</html>
