<title>S47 test — TrustBox + CookieWX</title>

<!-- S47: pagina usa-e-getta per E2E Trustpilot. Regole demo via override
     (come demo.html). Su sito reale questa riga non serve. -->
<script>window.COOKIEWX_RULES_DOMAIN = "repubblica.it";</script>
<script src="/loader.js"></script>

<!-- TrustBox script (bootstrap reale Trustpilot) -->
<script type="text/javascript" src="https://widget.trustpilot.com/bootstrap/v5/tp.widget.bootstrap.min.js" async></script>

<script>
// ---- Sonda di rete S47: registra OGNI richiesta verso host trustpilot ----
window.__S47 = { requests: [], cookies: [] };
(function () {
  function host(u){ try { return new URL(u, location.href).hostname; } catch(_) { return ""; } }
  function isTp(u){ return /(^|\.)trustpilot\.(com|net)$/i.test(host(u)); }
  function log(kind, url){ if (isTp(url)) window.__S47.requests.push({ kind: kind, url: url, t: Date.now() }); }

  var of = window.fetch;
  window.fetch = function (input, init) {
    try { log("fetch", typeof input === "string" ? input : (input && input.url) || String(input)); } catch(_){}
    return of.apply(this, arguments);
  };
  var oo = XMLHttpRequest.prototype.open;
  XMLHttpRequest.prototype.open = function (m, u) {
    try { log("xhr", u); } catch(_){}
    return oo.apply(this, arguments);
  };
  var os = navigator.sendBeacon && navigator.sendBeacon.bind(navigator);
  if (os) navigator.sendBeacon = function (u, d) { try { log("beacon", u); } catch(_){} return os(u, d); };

  new PerformanceObserver(function (list) {
    list.getEntries().forEach(function (e) { if (isTp(e.name)) log("perf:" + (e.initiatorType || "?"), e.name); });
  }).observe({ entryTypes: ["resource"] });

  function snapCookies() {
    window.__S47.cookies.push({ t: Date.now(), raw: document.cookie });
  }
  setInterval(function () {
    var last = window.__S47.cookies[window.__S47.cookies.length - 1];
    if (!last || last.raw !== document.cookie) log("cookie-cambio", "cookie");
    if (!last || last.raw !== document.cookie) snapCookies();
  }, 500);
  snapCookies();
})();

// ---- Iniezione dinamica (test MutationObserver): secondo bootstrap dopo 3s ----
function s47InjectDynamic() {
  var s = document.createElement("script");
  s.src = "https://widget.trustpilot.com/bootstrap/v5/tp.widget.bootstrap.min.js?dyn=1";
  s.async = true;
  document.body.appendChild(s);
  window.__S47.dynInjectedAt = Date.now();
}
setTimeout(s47InjectDynamic, 3000);
</script>

  body { font-family: system-ui, sans-serif; max-width: 720px; margin: 40px auto; padding: 0 16px; color: #111; }
