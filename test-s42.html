<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="utf-8">
  <title>Test S42 — snippet senza chiave</title>
  <meta name="robots" content="noindex">
  <script>
    // Cattura i console.warn per la verifica automatica
    window.__S42_WARNS = [];
    (function () {
      var orig = console.warn;
      console.warn = function () {
        window.__S42_WARNS.push(Array.prototype.join.call(arguments, " "));
        return orig.apply(console, arguments);
      };
    })();
  </script>
  <!-- S42: snippet SENZA data-cookiewx-key → il loader deve abortire -->
  <script src="/loader.js"></script>
</head>
<body>
  <h1>Test S42: senza chiave il loader non si attiva</h1>
  <script>
    // Probe: script di categoria marketing (pattern facebook.net) → il
    // loader lo blocca pre-consenso; all'abort deve essere rilasciato
    // (tentativo di fetch osservabile via performance API, 404 atteso).
    setTimeout(function () {
      var s = document.createElement("script");
      s.src = "https://connect.facebook.net/s42-probe-inesistente.js";
      document.body.appendChild(s);
    }, 300);
  </script>
</body>
</html>
