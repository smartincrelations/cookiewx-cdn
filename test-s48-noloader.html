<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex,nofollow">
<title>S48 test scanner — mappa OSM senza loader</title>
<link rel="stylesheet" href="/test-s47-s48-assets/leaflet.css">
<script src="/test-s47-s48-assets/leaflet.js"></script>
<style>#map { height: 320px; }</style>
</head>
<body>
<h1>S48 — mappa OSM (senza CookieWX) per test classificatore</h1>
<div id="map"></div>
<script>
  var map = L.map("map").setView([41.8919, 12.5113], 13);
  L.tileLayer("https://tile.openstreetmap.org/{z}/{x}/{y}.png", { maxZoom: 19 }).addTo(map);
  setTimeout(function () {
    fetch("https://nominatim.openstreetmap.org/search?format=json&q=Latina").then(function(r){return r.json();}).then(function(j){
      document.title = "S48 geo " + j.length;
    }).catch(function(){});
  }, 1200);
</script>
</body>
</html>
